<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Image Engine - Scrap Your Image</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glow-color: rgba(99, 102, 241, 0.25);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.8s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-align: center;
            position: relative;
        }

        .search-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 15px;
            color: var(--text-secondary);
            pointer-events: none;
            transition: var(--transition);
        }

        input[type="text"] {
            width: 100%;
            padding: 1.1rem 1.1rem 1.1rem 3rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px var(--glow-color);
            background: rgba(15, 23, 42, 0.8);
        }

        input[type="text"]:focus + svg {
            color: #6366f1;
        }

        input[type="submit"] {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 14px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -3px var(--glow-color);
            opacity: 0.95;
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Engine</h1>
            <p class="subtitle">Scrape and download web images in real-time</p>
        </header>

        <main>
            <div class="search-card">
                <h2>Begin Your Search</h2>
                <form action="/review" method="POST">
                    <div class="input-wrapper">
                        <input type="text" name="content" placeholder="Enter keywords (e.g. nebula, cypher)..." required autocomplete="off">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                    <input type="submit" value="Search & Extract">
                </form>
            </div>
        </main>

        <footer>
            <p>Cloud Scraping Engine &bull; Powered by Flask & MongoDB</p>
        </footer>
    </div>
</body>
</html>
